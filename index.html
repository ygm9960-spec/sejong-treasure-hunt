function openQREdit(id){const q=data.qrs.find(x=>x.id===id);if(!q)return;showDialog(`<div class="eyebrow">QR CONTENT EDITOR</div><h2 class="h2">✏️ ${q.id} 수정</h2><div class="note">인쇄된 QR은 그대로! 연결된 결과만 바꿀 수 있어요.</div><form id="qrEditForm" class="stack" style="margin-top:14px"><div class="field"><label>종류</label><select id="qeKind"><option value="miss" ${q.kind==='miss'?'selected':''}>🤡 꽝</option><option value="treasure" ${q.kind==='treasure'?'selected':''}>💎 보물</option></select></div><div class="field" id="qeTreasureWrap"><label>보물 종류</label><select id="qeTreasure">${data.treasures.map(t=>`<option value="${t.id}" ${t.id===q.treasureId?'selected':''}>${escapeHTML(t.emoji)} ${escapeHTML(t.name)} (${t.id})</option>`).join('')}</select></div><div class="field" id="qeMemeWrap"><label>꽝 이미지</label><select id="qeMeme"><option value="random">🎲 매번 랜덤</option>${data.memes.map(m=>`<option value="${m.id}" ${m.id===q.memeId?'selected':''}>${escapeHTML(m.emoji)} ${escapeHTML(m.text.slice(0,25))}</option>`).join('')}</select></div><div class="field"><label>설치 장소 (선택 · 비워도 됨)</label><input id="qeLocation" value="${escapeHTML(q.location)}" maxlength="60" placeholder="예: 2층 복도 창문 옆"></div><div class="row"><button class="btn white" type="button" id="previewThis" style="flex:1">👀 학생 화면 미리보기</button><button class="btn main" style="flex:1">저장하기</button></div></form>`);const kindChange=()=>{$('#qeTreasureWrap').style.display=$('#qeKind').value==='treasure'?'flex':'none';$('#qeMemeWrap').style.display=$('#qeKind').value==='miss'?'flex':'none'};$('#qeKind').onchange=kindChange;kindChange();const newVals=()=>({kind:$('#qeKind').value,treasureId:$('#qeKind').value==='treasure'?$('#qeTreasure').value:'',memeId:$('#qeKind').value==='miss'?$('#qeMeme').value:'random',location:$('#qeLocation').value.trim()});$('#previewThis').onclick=()=>showAdminQrPreview({...q,...newVals()});$('#qrEditForm').onsubmit=async e=>{e.preventDefault();let change=newVals();try{let moved=null;if(change.kind==='treasure'){let old=data.qrs.find(x=>x.id!==id&&x.kind==='treasure'&&x.treasureId===change.treasureId);if(old)moved={...old,kind:q.kind==='treasure'?'treasure':'miss',treasureId:q.kind==='treasure'?q.treasureId:'',memeId:q.kind==='miss'?q.memeId:'random'}}const revised={...q,...change};await batchSaveEntities('qrs',moved?[revised,moved]:[revised]);Object.assign(q,change);if(moved)Object.assign(data.qrs.find(x=>x.id===moved.id),moved);saveLocal();hideDialog();render();toast(`✅ ${q.id} 저장 완료${moved?' · 다른 QR과 콘텐츠 교환됨':''}`)}catch(err){toast('저장 실패: '+err.message)}}}
async function randomAssign(){if(!confirm('80개 QR 중 12개에 서로 다른 보물을 무작위 배치할까요? 기존 배치가 바뀝니다.'))return;let indices=Array.from({length:80},(_,i)=>i);for(let i=indices.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}let selected=indices.slice(0,12);let changes=data.qrs.map((q,i)=>({...q,kind:selected.includes(i)?'treasure':'miss',treasureId:selected.includes(i)?`T${String(selected.indexOf(i)+1).padStart(2,'0')}`:'',memeId:'random'}));try{await batchSaveEntities('qrs',changes);data.qrs=changes;saveLocal();render();toast('12개 보물을 무작위 배치했어요!')}catch(err){toast('배치 실패: '+err.message)}}

function compressImage(file){return new Promise((resolve,reject)=>{if(file.size>15*1024*1024){reject(Error('15MB 이하 이미지를 선택해주세요.'));return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let limit=600,scale=Math.min(1,limit/Math.max(img.width,img.height));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let quality=.65,s=c.toDataURL('image/jpeg',quality);if(s.length>480000){let ratio=Math.sqrt(480000/s.length);let c2=document.createElement('canvas');c2.width=Math.round(c.width*ratio);c2.height=Math.round(c.height*ratio);c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);s=c2.toDataURL('image/jpeg',.55)}resolve(s)};img.onerror=()=>reject(Error('이미지를 읽을 수 없습니다.'));img.src=reader.result};reader.onerror=()=>reject(Error('이미지 읽기 실패'));reader.readAsDataURL(file)})}
async function prepareAsset(file,collection,id){const dataUrl=await compressImage(file);if(!F.enabled)return dataUrl;if(!F.adminUser||!F.adminStorage)throw Error('Storage 관리자 연결이 필요해요. Firebase Storage를 활성화해 주세요.');const st=F.lib.storage;const path=`game-assets/${collection}/${id}/${Date.now()}-${Math.floor(Math.random()*100000)}.jpg`;const ref=st.ref(F.adminStorage,path);await st.uploadString(ref,dataUrl,'data_url',{contentType:'image/jpeg',cacheControl:'public,max-age=3600'});return await st.getDownloadURL(ref)}
