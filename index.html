/* v2 visual system — collectibles, high-contrast touch targets and responsive layouts */
:root{--paper:#edf2f2;--ink:#172438;--sea:#087e79;--sun:#ffd270;--muted:#627280;--line:#dbe4e7;--shadow:0 15px 42px rgba(21,45,61,.08);--radius:23px}

.game-hero .eyebrow{color:#a9ead2}.game-hero .lead{color:#c7e5df}.game-hero .h1{font-size:clamp(29px,4.4vw,49px);margin:9px 0;letter-spacing:-1.7px}

.overlay{background:rgba(6,21,29,.73)}.dialog{box-shadow:0 24px 90px #00171f75}.result-art{min-height:215px;position:relative}.result-art .emoji{filter:drop-shadow(0 14px 11px #0002)}

/* ==================================================================
  v3.0 — poster-inspired cinematic edition. Lightweight CSS only.
  Decorative animations never affect saved QR, player or Firebase data.
 ================================================================== */
:root{--v30-gold:#fbd66c;--v30-navy:#10183f;--v30-violet:#8f71ee}
body{background-image:radial-gradient(circle at 0% 0%,rgba(151,113,238,.10),transparent 36%),radial-gradient(circle at 100% 0%,rgba(251,214,108,.10),transparent 35%),linear-gradient(180deg,#f6f6ff,#edf1fa)}
#app.v30-page-enter{animation:v30PageIn .32s ease-out both}
@keyframes v30PageIn{from{opacity:.82}to{opacity:1}}
/* 4. The main chest gradually unlocks as 3/6/9/12 cards are collected */
.v30-magic-stage{isolation:isolate;position:relative}
.v30-magic-stage .hero-ring{border-color:rgba(255,213,106,.20);transition:box-shadow .4s,border-color .4s}
.v30-magic-stage:before,.v30-magic-stage:after{content:'✦';position:absolute;top:17%;left:18%;font-size:21px;color:#ffe5a4;animation:v30Twinkle 3s ease-in-out infinite;opacity:.5;pointer-events:none}
.v30-magic-stage:after{left:auto;right:13%;top:68%;animation-delay:1.5s;font-size:15px}
.v30-magic-stage .hero-chest{position:relative;z-index:2;transition:filter .4s}
.v30-chest-glow{position:absolute;z-index:0;inset:15%;border-radius:50%;filter:blur(20px);opacity:0;pointer-events:none;background:radial-gradient(circle,#ffd970a6,transparent 64%)}
.v30-sigil{position:absolute;inset:12%;display:grid;place-items:center;border:2px dashed rgba(250,211,126,.24);border-radius:50%;font-size:28px;letter-spacing:28px;color:rgba(255,227,165,.42);transform:rotate(0deg);animation:v30Sigil 25s linear infinite;pointer-events:none}
.v30-stage-caption{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#ffffff16;color:#fff4ce;border:1px solid #ffdf9960;border-radius:999px;padding:5px 13px;font-weight:850;font-size:12px;white-space:nowrap}
.v30-stage-1 .hero-chest{filter:drop-shadow(0 0 9px rgba(250,215,128,.48))}.v30-stage-1 .v30-chest-glow{opacity:.35}
.v30-stage-2 .hero-chest{filter:drop-shadow(0 0 20px rgba(250,215,128,.65))}.v30-stage-2 .v30-chest-glow{opacity:.62}
.v30-stage-3 .hero-ring{box-shadow:0 0 0 19px #af8af31d,0 0 0 45px #f8cc7124,0 0 34px #f9c76d55;border-color:#ffe4a2}.v30-stage-3 .v30-chest-glow{opacity:.8}.v30-stage-3 .v30-sigil{border-color:#ffe29c9a;color:#ffe9bc}
.v30-stage-4 .hero-ring{box-shadow:0 0 0 22px #f8d97a20,0 0 0 47px #f8d97a12,0 0 50px #f7ce76bb;border-color:#ffe6a1}.v30-stage-4 .v30-chest-glow{opacity:1}.v30-stage-4 .hero-chest{filter:drop-shadow(0 0 23px #ffe28b)}
@keyframes v30Twinkle{0%,100%{opacity:.20;transform:scale(.8)}50%{opacity:.85;transform:scale(1.25)}}
@keyframes v30Sigil{to{transform:rotate(360deg)}}
/* 3. Holographic cards: animation is interaction-based only */
.atlas-collection-grid .atlas-card{--tilt-x:0deg;--tilt-y:0deg;--shine-x:50%;--shine-y:50%;transform:perspective(850px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));transform-style:preserve-3d;transition:transform .17s ease,box-shadow .2s ease,border-color .2s ease;isolation:isolate;will-change:auto}
.atlas-collection-grid .atlas-card.owned:before,.atlas-collection-grid .atlas-card.first:before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--shine-x) var(--shine-y),rgba(255,255,255,.53),transparent 35%);mix-blend-mode:screen;opacity:0;transition:opacity .16s}
.atlas-collection-grid .atlas-card.owned:hover:before,.atlas-collection-grid .atlas-card.first:hover:before,.atlas-collection-grid .atlas-card:focus-visible:before{opacity:1}
.atlas-collection-grid .atlas-card.first{background-image:linear-gradient(125deg,#ffefb8,#fff8e4 32%,#f9d47d 63%,#fff8e6 91%)}
.atlas-collection-grid .atlas-card.first .atlas-deck-border{background-image:linear-gradient(135deg,#fff9b1,#cb9044,#fff2af,#b88634);background-size:220% 220%;animation:v30GoldSlide 4.2s ease-in-out infinite;opacity:.36}
.atlas-collection-grid .atlas-card.locked:active .atlas-seal-mark{animation:v30Seal .32s ease}
.atlas-collection-grid .atlas-card.owned:active,.atlas-collection-grid .atlas-card.first:active{transform:perspective(850px) scale(.98) rotateZ(-.7deg)}
@keyframes v30GoldSlide{50%{background-position:100% 100%}}
@keyframes v30Seal{50%{transform:scale(.94) rotate(-6deg);filter:brightness(1.5)}}
/* 1 and 5. Short cinematic treasure discovery and collection milestones */
.v30-skip{background:#ffffff18;border:1px solid #ffffff55;color:#fff;font-size:13px;font-weight:800;padding:9px 15px;border-radius:12px;cursor:pointer}
.v30-result-shell{text-align:center;animation:v30ResultShow .32s ease both}
.v30-result-kicker{display:block;color:#8260b4;font-size:12px;font-weight:950;letter-spacing:2px;margin-bottom:8px}
.v30-result-card{position:relative;display:grid;place-items:center;max-width:290px;aspect-ratio:1.05;margin:0 auto;border-radius:24px;padding:18px;overflow:hidden;border:3px solid #f1d38c;background:radial-gradient(circle at 45% 32%,#fff 0%,var(--v30-accent,#ffe5b8) 90%);box-shadow:0 17px 28px #493a761e,inset 0 0 0 5px #ffffff6b}
.v30-result-card:before{content:'';position:absolute;inset:-45%;background:conic-gradient(from 0deg,transparent 0 25%,#ffffff9c 33%,transparent 43% 100%);animation:v30Sigil 6s linear infinite;pointer-events:none}
.v30-result-image{display:grid;place-items:center;position:relative;z-index:2;min-width:0;width:100%;height:100%}

.v30-result-image .emoji{font-size:100px}
.v30-result-sigil{position:absolute;z-index:1;font-size:180px;color:#ffffff6c}
.v30-result-corner{position:absolute;right:13px;top:11px;color:#a46b2f;font-weight:900}
.v30-first-result .v30-result-card{border-color:#eabb53;box-shadow:0 0 0 5px #ffe9a899,0 22px 35px #bd8b4d4a}
.v30-first-message{border-radius:13px;background:#fff0c6;color:#7e540f;padding:11px 12px;font-weight:950;margin-top:12px}
.v30-result-progress{padding:12px 15px;background:#f6f7ff;border-radius:14px;margin-top:12px;text-align:left}
.v30-result-progress>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#475577;font-weight:850;font-size:13px}
.v30-result-progress strong{font-size:23px;color:#142454}.v30-result-progress small{font-size:13px}
.v30-progress-track{height:9px;background:#e5e8f5;border-radius:99px;overflow:hidden;margin-top:7px}
.v30-progress-track>span{height:100%;display:block;border-radius:99px;background:linear-gradient(90deg,#8660ed,#ffd575);animation:v30ProgressGrow .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.v30-milestone{display:flex;gap:13px;align-items:center;text-align:left;padding:13px;background:linear-gradient(105deg,#151f56,#403277);border-radius:17px;margin-top:13px;color:#fff;animation:v30ResultShow .35s ease both}
.v30-milestone>span{font-size:38px;animation:v30MilestonePop .65s ease both}
.v30-milestone small{display:block;color:#e9dba8;letter-spacing:1px;font-size:10px;font-weight:900}
.v30-milestone strong{display:block;font-size:17px}
@keyframes v30ResultShow{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
@keyframes v30ProgressGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes v30MilestonePop{0%{transform:scale(.5) rotate(-20deg)}65%{transform:scale(1.22)}100%{transform:scale(1) rotate(0)}}

/* Full-screen treasure reveal */
.overlay.treasure-theater{padding:0;background:#090a20;backdrop-filter:none}
.treasure-theater .dialog{width:100%;height:100%;max-height:none;padding:0;border-radius:0;background:transparent;box-shadow:none;overflow:hidden;animation:none}

@keyframes treasure-ring{0%{opacity:0;transform:scale(1.7) rotate(-28deg)}45%,87%{opacity:.88}100%{opacity:0;transform:scale(.54) rotate(15deg)}}

@keyframes treasure-crack{from{stroke-dashoffset:230}to{stroke-dashoffset:0}}

.gacha-charge-layer{position:absolute;inset:0;display:grid;place-items:center}
.gacha-pillar{position:absolute;left:50%;top:0;bottom:0;width:130px;margin-left:-65px;background:linear-gradient(90deg,transparent,var(--rc) 42%,#fff 50%,var(--rc) 58%,transparent);filter:blur(8px);opacity:0;transform:scaleX(.05)}
.is-ready .gacha-pillar{animation:gPillar .6s ease-out forwards,gPillarPulse 1.2s .6s ease-in-out infinite}
.gacha-circle{grid-area:1/1;width:min(78vw,340px);aspect-ratio:1;position:relative;opacity:0;animation:gFadeIn .8s .3s ease-out forwards}
.gacha-circle i{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--rc);box-shadow:0 0 18px var(--rc),inset 0 0 18px var(--rc);opacity:.7;animation:gSpin 9s linear infinite}
.gacha-circle i:nth-child(2){inset:14%;border-style:solid;border-width:1px;animation-direction:reverse;animation-duration:6s}
.gacha-circle i:nth-child(3){inset:-9%;border-style:dotted;border-width:3px;opacity:.45;animation-duration:14s}
.is-ready .gacha-circle i{animation-duration:1.8s}
.gacha-aura{grid-area:1/1;width:min(60vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--rc) 0%,transparent 65%);filter:blur(10px);opacity:.25;transform:scale(.6);animation:gAura 2.7s ease-in forwards}
.is-ready .gacha-aura{animation:gAuraPulse .8s ease-in-out infinite alternate}
.gacha-particles{grid-area:1/1;width:0;height:0;position:relative}
.gacha-particles i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);border-radius:50%;background:#fff;box-shadow:0 0 10px var(--rc),0 0 4px #fff;opacity:0;animation:gConverge 1.1s var(--d) ease-in infinite}
.gacha-chest{grid-area:1/1;z-index:2;font-size:clamp(110px,30vw,170px);line-height:1;filter:drop-shadow(0 0 20px var(--rc));animation:gDrop .9s cubic-bezier(.3,1.6,.5,1) both,gShake 1.8s .9s ease-in both}
.is-ready .gacha-chest{animation:gReady .5s ease-in-out infinite alternate;filter:drop-shadow(0 0 30px var(--rc)) drop-shadow(0 0 60px var(--rc)) brightness(1.15)}
.is-burst .gacha-chest{animation:gChestPop .6s ease-in forwards}
.gacha-hint,.gacha-prompt{position:absolute;left:0;right:0;margin:0;padding:0 16px;bottom:calc(14% + env(safe-area-inset-bottom))}
.gacha-hint{font-weight:850;font-size:15px;color:#e6dcff;letter-spacing:.5px;animation:gBlink 1.4s ease-in-out infinite}
.gacha-prompt{font-weight:950;font-size:clamp(17px,5vw,22px);color:#fff;text-shadow:0 0 12px var(--rc),0 0 24px var(--rc);opacity:0}
.is-ready .gacha-hint,.is-burst .gacha-hint{display:none}
.is-ready .gacha-prompt{animation:gPrompt .9s ease-in-out infinite alternate}
.is-burst .gacha-charge-layer{animation:gFadeOut .5s .25s forwards}
.is-reveal .gacha-charge-layer{display:none}
.gacha-flash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
.rarity-legend.is-ready .gacha-flash{animation:gMiniFlash .55s ease-out}
.is-burst .gacha-flash{animation:gFlash .8s ease-out forwards}
.gacha-shock{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 30px var(--rc),inset 0 0 30px var(--rc);opacity:0;z-index:15;pointer-events:none}
.is-burst .gacha-shock{animation:gShock .65s ease-out forwards}
.is-burst .gacha-shock.s2{animation-delay:.12s}
.gacha-reveal-layer{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,16px);padding:calc(48px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom))}
.is-reveal .gacha-reveal-layer{display:flex}
.gacha-rank{font-weight:1000;font-size:clamp(20px,6vw,30px);letter-spacing:2px;background:linear-gradient(90deg,#fff,var(--rc),#fff,var(--rc2),#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:gRankIn .6s 1.1s cubic-bezier(.2,1.6,.4,1) forwards,gShimmer 2.4s 1.7s linear infinite}
.gacha-card-wrap{position:relative;perspective:1100px;animation:gFloat 3s 1.6s ease-in-out infinite}
.gacha-card-wrap::before{content:'';position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,var(--rc) 0%,transparent 62%);filter:blur(18px);opacity:0;z-index:-1;animation:gFadeIn .8s .9s forwards,gAuraPulse 1.6s 1.7s ease-in-out infinite alternate}
.gacha-card{position:relative;width:min(64vw,270px,calc(46vh * .72));aspect-ratio:5/7;transform-style:preserve-3d;animation:gCardIn 1.35s cubic-bezier(.18,.9,.3,1.12) both}
.gacha-face{position:absolute;inset:0;border-radius:18px;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.gacha-back{transform:rotateY(180deg);display:grid;place-content:center;gap:8px;background:radial-gradient(circle at 50% 40%,#3b2a7a,#141541 70%);border:3px solid var(--rc);box-shadow:inset 0 0 0 6px rgba(255,255,255,.06)}
.gacha-back span{font:900 clamp(70px,20vw,110px)/1 Georgia,serif;color:var(--rc);text-shadow:0 0 20px var(--rc)}
.gacha-back small{font-size:11px;letter-spacing:3px;font-weight:900;color:#e9dcff}
.gacha-front{background:linear-gradient(135deg,var(--rc),#fff 30%,var(--rc2) 55%,#fff 75%,var(--rc));box-shadow:0 0 30px var(--rc),0 0 70px var(--rc)}
.rarity-legend .gacha-front{background:linear-gradient(135deg,#ff6b6b,#ffd56a,#7dffb0,#6bc8ff,#c58bff,#ff6bd5,#ffd56a);background-size:300% 300%;animation:gHolo 3s linear infinite alternate}
.gacha-inner{position:absolute;inset:4px;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;background:#120f2e}
.gacha-head{flex:0 0 auto;padding:10px 10px 9px;background:linear-gradient(180deg,#1d1748,#120f2e);border-bottom:1px solid var(--rc)}
.gacha-name{font-weight:950;font-size:clamp(16px,4.8vw,21px);line-height:1.25;color:#fff;text-shadow:0 0 10px var(--rc),0 2px 4px #000;overflow-wrap:anywhere;opacity:0;animation:gUp .5s 1.3s ease-out forwards}
.gacha-art{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#fff 0%,var(--treasure-color) 55%,#2a1f4a 120%)}
.gacha-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.gacha-art .emoji{font-size:clamp(80px,22vw,120px);filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
.gacha-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 48%,transparent 62%);transform:translateX(-120%);animation:gShine 2.8s 1.4s ease-in-out infinite}
.gacha-info{flex:0 0 auto;padding:8px 10px 10px;background:linear-gradient(0deg,#120f2e,#1d1748);border-top:1px solid var(--rc)}
.gacha-stars{display:flex;justify-content:center;gap:2px;font-size:clamp(17px,4.6vw,22px);line-height:1}
.gacha-stars span{display:inline-block;color:#ffd54a;text-shadow:0 0 8px #ffb300,0 0 2px #fff;opacity:0;animation:gStar .45s calc(1.45s + var(--i) * .22s) cubic-bezier(.2,1.8,.4,1) forwards}
.gacha-desc{margin-top:6px;font-size:clamp(12px,3.4vw,14px);line-height:1.4;font-weight:700;color:#e8e1ff;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:0;animation:gUp .5s 2.4s ease-out forwards}
.gacha-first{position:absolute;top:58px;right:10px;z-index:2;padding:6px 11px;border-radius:8px;background:linear-gradient(135deg,#fff3c4,#ffc843);color:#5a3500;font-weight:950;font-size:13px;border:2px solid #b77920;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;animation:gStamp .4s 2.6s cubic-bezier(.2,1.6,.4,1) forwards}
.gacha-title{margin:0;font-size:clamp(26px,8vw,40px);font-weight:1000;color:#fff2c4;text-shadow:0 0 14px var(--rc),0 3px 0 rgba(0,0,0,.35);opacity:0;animation:gUp .5s 2s ease-out forwards}
.gacha-continue{border:0;border-radius:16px;padding:14px 28px;min-height:52px;font-weight:950;font-size:16px;color:#2c1b00;background:linear-gradient(135deg,#ffe08a,#ffb43d);box-shadow:0 6px 0 #c98a22,0 0 24px rgba(255,200,90,.5);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .4s,transform .4s}
.gacha-continue.show{opacity:1;transform:none;pointer-events:auto;animation:gBtnPulse 1.4s .5s ease-in-out infinite}
.gacha-sparkles{position:absolute;inset:0;z-index:6;pointer-events:none;display:none}
.is-reveal .gacha-sparkles{display:block}
.gacha-sparkles i{position:absolute;left:var(--l);bottom:-30px;font-style:normal;font-size:var(--z);color:var(--rc);text-shadow:0 0 8px var(--rc);opacity:0;animation:gRise var(--t) var(--d) linear infinite}
.gacha-skip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:30}
.is-reveal .gacha-skip{display:none}
@keyframes gSpin{to{transform:rotate(360deg)}}
@keyframes gFadeIn{to{opacity:1}}
@keyframes gFadeOut{to{opacity:0}}
@keyframes gBlink{50%{opacity:.45}}
@keyframes gTwinkle{from{opacity:.55}to{opacity:1}}
@keyframes gRaysIn{from{opacity:0}to{opacity:.5}}
@keyframes gPillar{to{opacity:.55;transform:scaleX(1)}}
@keyframes gPillarPulse{0%,100%{opacity:.55;transform:scaleX(1)}50%{opacity:.85;transform:scaleX(1.15)}}
@keyframes gAura{to{opacity:.85;transform:scale(1.15)}}
@keyframes gAuraPulse{from{opacity:.75;transform:scale(1.05)}to{opacity:1;transform:scale(1.3)}}
@keyframes gConverge{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}20%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(.2)}}
@keyframes gDrop{0%{opacity:0;transform:translateY(-70vh) scale(.6)}70%{opacity:1;transform:translateY(8px) scale(1.05,.92)}100%{opacity:1;transform:none}}
@keyframes gShake{0%{transform:none}20%{transform:rotate(-3deg)}30%{transform:rotate(3deg)}45%{transform:rotate(-5deg) scale(1.03)}55%{transform:rotate(5deg) scale(1.03)}65%{transform:rotate(-7deg) scale(1.06)}72%{transform:rotate(7deg) scale(1.06)}80%{transform:rotate(-9deg) scale(1.08)}87%{transform:rotate(9deg) scale(1.08)}94%{transform:rotate(-6deg) scale(1.1)}100%{transform:scale(1.1)}}
@keyframes gReady{from{transform:scale(1.08) rotate(-4deg)}to{transform:scale(1.16) rotate(4deg)}}
@keyframes gChestPop{0%{transform:scale(1.15)}40%{transform:scale(.9);filter:brightness(2) drop-shadow(0 0 40px #fff)}100%{transform:scale(2.6);opacity:0;filter:brightness(4) drop-shadow(0 0 80px #fff)}}
@keyframes gPrompt{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1.06)}}
@keyframes gFlash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes gMiniFlash{0%{opacity:0}25%{opacity:.7;background:#ffe9a8}100%{opacity:0}}
@keyframes gShock{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(9)}}
@keyframes gRankIn{from{opacity:0;transform:scale(2.2);letter-spacing:14px}to{opacity:1;transform:none;letter-spacing:2px}}
@keyframes gShimmer{to{background-position:-250% 0}}
@keyframes gFloat{50%{transform:translateY(-8px)}}
@keyframes gCardIn{0%{opacity:0;transform:translateY(60px) rotateY(900deg) scale(.25)}20%{opacity:1}100%{opacity:1;transform:none}}
@keyframes gHolo{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes gShine{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
@keyframes gStar{from{opacity:0;transform:scale(3) rotate(-60deg)}to{opacity:1;transform:none}}
@keyframes gUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gStamp{from{opacity:0;transform:rotate(-10deg) scale(2.6)}to{opacity:1;transform:rotate(8deg) scale(1)}}
@keyframes gBtnPulse{50%{box-shadow:0 6px 0 #c98a22,0 0 40px rgba(255,210,110,.9)}}
@keyframes gRise{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-105vh) rotate(240deg)}}
/* ===== v3.2: close button, ranking, tutorial ===== */
.dialog>.x{z-index:40;top:10px;right:12px;width:42px;height:42px;display:grid;place-items:center;padding:0;line-height:1;font-size:24px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dialog>.x::after{content:'';position:absolute;inset:-8px;border-radius:14px}
@media(max-width:580px){.mobile-bottom-nav{grid-template-columns:1fr 1.15fr 1fr 1fr 1fr 1fr}}
.lb-shell{padding:clamp(14px,2.8vw,26px);border-radius:26px;border:1px solid #cfd8ee;background:linear-gradient(155deg,rgba(255,255,255,.96),rgba(239,242,252,.97));box-shadow:0 21px 55px rgba(7,17,46,.1)}
.lb-shell .eyebrow{color:#18827d}
#rankSection,#collectionSection{scroll-margin-top:calc(78px + env(safe-area-inset-top))}
.lb-desc{margin:4px 0 0;color:#5f6889;font-size:13px;font-weight:650}
.lb-live{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:#fff0f0;color:#d23a40;font-size:12px;font-weight:900;white-space:nowrap}
.lb-live::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;animation:lbLive 1.4s ease-in-out infinite}
.lb-mine{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin:2px 0 10px;padding:12px 14px;border:0;border-radius:14px;background:#141d45;color:#fff;font:inherit;font-size:14px;font-weight:800;text-align:left;cursor:pointer}
.lb-mine b{color:#ffd54a;font-size:16px}
.lb-mine span:last-child{opacity:.7;font-size:12px;white-space:nowrap}
.lb-list{max-height:min(440px,58vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding:2px 4px 2px 2px;outline:none}
.lb-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:#fff;border:1px solid #e1e6f3;flex:0 0 auto}
.lb-rk{font-weight:950;font-size:16px;color:#5b6690;text-align:center}
.lb-name{min-width:0}
.lb-name b{display:block;font-size:15px;color:#141d45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name small{display:block;color:#6a7396;font-size:12px;font-weight:750}
.lb-cnt{font-weight:950;color:#141d45;font-size:15px;white-space:nowrap}
.lb-cnt small{font-size:11px;color:#8a92b2}
.lb-row.t1,.lb-row.t2,.lb-row.t3{padding-top:11px;padding-bottom:11px}
.lb-row.t1 .lb-rk,.lb-row.t2 .lb-rk,.lb-row.t3 .lb-rk{font-size:26px}
.lb-row.t1{background:linear-gradient(135deg,#fff8dc,#ffe49b);border-color:#f0c552}
.lb-row.t2{background:linear-gradient(135deg,#f7f9fc,#dfe5ee);border-color:#c3ccd9}
.lb-row.t3{background:linear-gradient(135deg,#fff3ea,#f6d2b6);border-color:#e3ab82}
.lb-row.me{border:2px solid #6b4cff;box-shadow:0 0 0 4px rgba(107,76,255,.14)}
.lb-me{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;background:#6b4cff;color:#fff;font-size:11px;vertical-align:2px}
.lb-empty{padding:26px 12px;text-align:center;color:#6a7396;font-weight:800;line-height:1.6;background:#fff;border-radius:14px;border:1px dashed #cfd8ee}
@keyframes lbLive{50%{opacity:.25}}
.tut{position:fixed;inset:0;z-index:10000;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.tut-hole{position:fixed;left:50%;top:50%;width:0;height:0;margin:0;padding:0;border:0;border-radius:16px;background:transparent;cursor:pointer;box-shadow:0 0 0 9999px rgba(4,8,28,.8),0 0 0 3px #ffd54a,0 0 24px 6px rgba(255,213,74,.7);animation:tutPulse 1.3s ease-in-out infinite;outline:none}
.tut-hole.tapped{animation:tutTapped .5s ease-out}
.tut-finger{position:absolute;left:50%;margin-left:-18px;font-size:36px;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));animation:tutFinger .9s ease-in-out infinite}
.tut-hole:not(.low) .tut-finger{top:calc(100% + 4px)}
.tut-hole.low .tut-finger{bottom:calc(100% + 4px)}
.tut-hole.tapped .tut-finger{display:none}
.tut-bubble{position:fixed;left:16px;right:16px;margin:0 auto;max-width:380px;padding:16px 18px 15px;border-radius:20px;background:#fff;color:#141d45;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.4);transition:background .25s}
.tut-step{display:inline-block;padding:3px 11px;border-radius:99px;background:#141d45;color:#ffd54a;font-size:11px;font-weight:900;letter-spacing:1px}
.tut-bubble h3{margin:8px 0 4px;font-size:19px;font-weight:950}
.tut-bubble p{margin:0;font-size:14px;line-height:1.55;color:#3d4670;font-weight:650;word-break:keep-all}
.tut-cta{display:block;margin-top:10px;color:#6b4cff;font-size:15px;font-weight:950;animation:tutBlink 1.2s ease-in-out infinite}
.tut-bubble.ok{background:#e9fff3}
.tut-bubble.ok .tut-cta{color:#12895a;animation:none}
.tut-bubble.nudge{animation:tutShake .42s}
@keyframes tutPulse{50%{box-shadow:0 0 0 9999px rgba(4,8,28,.8),0 0 0 5px #ffd54a,0 0 38px 12px rgba(255,213,74,.95)}}
@keyframes tutTapped{0%{box-shadow:0 0 0 9999px rgba(4,8,28,.8),0 0 0 3px #7dffb0,0 0 0 0 rgba(125,255,176,.9)}100%{box-shadow:0 0 0 9999px rgba(4,8,28,.8),0 0 0 3px #7dffb0,0 0 0 26px rgba(125,255,176,0)}}
@keyframes tutFinger{50%{transform:scale(.82)}}
@keyframes tutBlink{50%{opacity:.5}}
@keyframes tutShake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.tut-hole,.tut-finger,.tut-cta,.lb-live::before{animation:none}}
@media (prefers-reduced-motion:reduce){.v30-result-kicker.treasure-first-stamp,.v30-result-card:before,.v30-progress-track>span{animation:none}}
/* 2. Ten existing miss types now have independent motion and ambience */
.v30-miss-scene,.v30-miss-result{position:relative;isolation:isolate;overflow:hidden;border-radius:20px;padding:12px}
.v30-miss-scene{background:linear-gradient(140deg,#f7f5ff,#fff);text-align:center}
.v30-miss-ambience{pointer-events:none;position:absolute;inset:-50%;z-index:-1;background:conic-gradient(from 0deg,transparent,#e9d7ff88,transparent,#f7dc9c88,transparent);animation:v30Sigil 9s linear infinite}
.v30-miss-result .v30-miss-art{position:relative;isolation:isolate;overflow:hidden;animation:v30MissEnter .4s ease both}
.v30-miss-result .v30-miss-art img{max-width:100%;max-height:245px;object-fit:contain}
.v30-miss-effects{position:absolute;z-index:-1;top:8px;right:10px;color:#fff9;font-weight:900;font-size:24px;letter-spacing:15px;animation:v30Twinkle 3s ease-in-out infinite}
.v30-miss-funny .v30-miss-art,.v30-miss-funny .result-art{animation:v30Wiggle .55s ease both}
.v30-miss-empty .v30-miss-art,.v30-miss-think .v30-miss-art{filter:grayscale(.9);animation:v30MissEnter .6s ease both}
.v30-miss-prank .v30-miss-art,.v30-miss-fake .result-art,.v30-miss-bait .result-art{animation:v30Bounce .55s ease both}
.v30-miss-error{background:linear-gradient(150deg,#ffe9e9,#fff);border:1px solid #ffaca7}
.v30-miss-error .v30-miss-art{animation:v30Glitch .42s steps(3,end) both}
.v30-miss-loading .result-art{animation:v30LoadPulse 1s ease infinite}
.v30-miss-escape .result-art{animation:v30Escape .9s ease-in-out both}
.v30-miss-think{background:linear-gradient(140deg,#f4f1fa,#fff)}
.v30-miss-error .v30-miss-ambience{background:repeating-linear-gradient(0deg,#f33a3a10,#f33a3a10 2px,transparent 2px,transparent 9px)}
.v30-miss-scene .v30-scene-particles{position:absolute;top:12px;right:14px;color:#a36ed2;letter-spacing:12px;font-size:23px}
@keyframes v30Wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}65%{transform:rotate(4deg)}}
@keyframes v30Bounce{0%{transform:scale(.6) rotate(-7deg)}65%{transform:scale(1.1) rotate(2deg)}100%{transform:scale(1)}}
@keyframes v30MissEnter{from{opacity:0;transform:translateY(19px)}to{opacity:1;transform:none}}
@keyframes v30Glitch{0%,100%{transform:none;filter:none}40%{transform:translate(-5px,2px);filter:hue-rotate(90deg)}70%{transform:translate(5px,-2px)}}
@keyframes v30LoadPulse{50%{opacity:.55;filter:brightness(1.25)}}
@keyframes v30Escape{20%{transform:translateX(-18px) rotate(-8deg)}65%{transform:translateX(22px) rotate(6deg)}}
/* 6. Clear, golden QR frame + success feedback + camera retry */

 <div class="section panel"><div class="row space"><div><h2 class="h2">👥 학생별 탐험 현황</h2><p class="tiny">테스트 학생을 검색한 뒤 해당 행의 삭제 버튼으로 참가 정보와 탐험 기록을 지울 수 있어요.</p></div><button class="btn white small" id="exportParticipants">⬇ CSV 다운로드</button></div><div class="v29-players-filters"><label>학생 검색<input type="search" id="playerSearch" placeholder="이름 또는 번호 검색" value="${escapeHTML(state.playerFilters.search)}"></label><label>학년<select id="playerGrade"><option value="all">전체</option>${[1,2,3].map(n=>`<option value="${n}" ${state.playerFilters.grade===String(n)?'selected':''}>${n}학년</option>`).join('')}</select></label><label>반<select id="playerClass"><option value="all">전체</option>${Array.from(new Set(participants.map(p=>String(p.className)))).filter(Boolean).sort((a,b)=>Number(a)-Number(b)).map(n=>`<option value="${escapeHTML(n)}" ${state.playerFilters.className===n?'selected':''}>${escapeHTML(n)}반</option>`).join('')}</select></label><label>도감<select id="playerComplete"><option value="all">전체</option><option value="done" ${state.playerFilters.complete==='done'?'selected':''}>12종 완성</option><option value="not" ${state.playerFilters.complete==='not'?'selected':''}>미완성</option></select></label><label>정렬<select id="playerOrder"><option value="class" ${state.playerFilters.order==='class'?'selected':''}>학년·반·번호순</option><option value="treasures" ${state.playerFilters.order==='treasures'?'selected':''}>보물 많은 순</option><option value="firsts" ${state.playerFilters.order==='firsts'?'selected':''}>최초 발견 많은 순</option></select></label></div>${renderFilteredPlayers(participants)}</div>`;
}
function qrWarnings(){let ts=data.qrs.filter(x=>x.kind==='treasure'),ids=ts.map(x=>x.treasureId);let invalid=ids.filter(x=>!data.treasures.some(t=>t.id===x));let duplicates=ids.filter((x,i)=>ids.indexOf(x)!==i);if(ts.length!==12||invalid.length||duplicates.length)return `<div class="note danger">⚠️ 현재 보물 QR ${ts.length}개 · ${duplicates.length?`중복 보물 ${duplicates.join(', ')}. `:''}${invalid.length?'알 수 없는 보물 포함. ':''}권장 설정은 서로 다른 보물 12개예요.</div>`;return `<div class="note">✅ 보물 12종이 서로 다른 QR에 정확히 한 개씩 배치되어 있어요.</div>`}
function importantQrChange(message){return phase()==='running'||phase()==='paused'?confirm('⚠️ 행사 진행 중 QR 설정 변경\n이미 수집한 도감은 자동으로 취소되지 않습니다.\n\n변경: '+message+'\n\n계속하시겠습니까?'):true}
async function recordQrChange(action){const entry={at:Date.now(),action:String(action).slice(0,140)};try{if(F.enabled){if(!F.adminUser)throw Error('관리자 로그인이 필요합니다.');const fs=F.lib.fs,ref=fs.doc(F.adminDb,'settings','app');let history=[];await fs.runTransaction(F.adminDb,async tx=>{const snap=await tx.get(ref),items=Array.isArray(snap.data()?.qrEditLog)?snap.data().qrEditLog:[];history=[entry,...items].slice(0,60);tx.set(ref,{qrEditLog:history},{merge:true})});data.settings.qrEditLog=history;}else{data.settings.qrEditLog=[entry,...(data.settings.qrEditLog||[])].slice(0,60);saveLocal();}}catch(err){console.warn('QR 변경 기록 저장 실패',err);toast('QR은 변경됐지만 변경 기록 저장에 실패했어요. 설정에서 확인해 주세요.')}}
function renderQrLog(){const entries=(data.settings.qrEditLog||[]).slice(0,15);return `<div class="section panel"><h3 class="h3">📝 최근 QR 설정 변경 기록</h3><p class="tiny">QR 배치 변경 이력을 최근 60건까지 저장하며, 여기서는 최근 15건만 표시해요. 설치 장소 정보는 기록하지 않습니다.</p>${entries.length?`<div class="v29-audit-log">${entries.map(e=>`<div><span>${escapeHTML(new Date(e.at).toLocaleString('ko-KR'))}</span><strong>${escapeHTML(e.action)}</strong></div>`).join('')}</div>`:'<div class="empty">아직 변경 기록이 없어요.</div>'}</div>`}
function renderFilteredPlayers(participants){const f=state.playerFilters||{},text=(f.search||'').trim().toLowerCase(),firstCounts={};Object.values(data.firstFinds||{}).forEach(v=>{if(v.playerId)firstCounts[v.playerId]=(firstCounts[v.playerId]||0)+1});let rows=participants.filter(p=>(!text||[p.name,p.studentNumber,String(p.grade)+'-'+p.className].some(v=>String(v||'').toLowerCase().includes(text)))&&(f.grade==='all'||String(p.grade)===f.grade)&&(f.className==='all'||String(p.className)===f.className)&&(f.complete==='all'||(f.complete==='done'?(p.collectedIds||[]).length===12:(p.collectedIds||[]).length<12)));rows.sort((a,b)=>{if(f.order==='treasures')return (b.collectedIds||[]).length-(a.collectedIds||[]).length||Number(a.grade)-Number(b.grade);if(f.order==='firsts')return (firstCounts[b.id]||0)-(firstCounts[a.id]||0)||Number(a.grade)-Number(b.grade);return Number(a.grade)-Number(b.grade)||Number(a.className)-Number(b.className)||Number(a.studentNumber||999)-Number(b.studentNumber||999)||a.name.localeCompare(b.name,'ko')});return `<div class="v29-results-count">검색 결과 <strong>${rows.length}</strong>명 / 전체 ${participants.length}명</div>${rows.length?`<div class="list-wrap"><table class="data-table"><thead><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th><th>보물</th><th>최초 발견</th><th>탐험 QR</th><th>꽝 누적</th><th>관리</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${escapeHTML(p.grade)}</td><td>${escapeHTML(p.className)}</td><td>${escapeHTML(p.studentNumber||'-')}</td><td>${escapeHTML(p.name)}</td><td><b>${(p.collectedIds||[]).length}/12</b></td><td>${firstCounts[p.id]||0}개</td><td>${seenCount(p)}/${qrTotal()}</td><td>${Number(p.missTotal||0)}</td><td><button type="button" class="btn danger small" data-delete-player="${escapeHTML(p.id)}" aria-label="${escapeHTML(fullName(p))} 기록 삭제" ${state.deletingPlayer?'disabled':''}>삭제</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">해당 조건에 맞는 학생이 없어요.</div>'}`}
function auditPrintQuick(){const check=[];const push=(label,ok,note='')=>check.push({label,ok,note});const qrs=data.qrs||[],treasure=qrs.filter(q=>q.kind==='treasure'),codes=qrs.map(q=>String(q.code||'').toUpperCase());push('QR 등록',qrs.length>=12,`${qrs.length}개`);push('보물 12종 정확히 배치',treasure.length===12&&new Set(treasure.map(q=>q.treasureId)).size===12&&data.treasures.every(t=>treasure.some(q=>q.treasureId===t.id)),`${treasure.length}개`);push('6자리 코드 형식 및 중복 검사',codes.length>0&&new Set(codes).size===codes.length&&codes.every(c=>/^[A-Z0-9]{6}$/.test(c)),'영문·숫자 6자리');const goodUrl=location.protocol==='https:'&&!['localhost','127.0.0.1'].includes(location.hostname)&&qrs.every(q=>{try{const u=new URL(qrUrl(q));return u.host===location.host&&u.searchParams.get('qr')===q.code}catch{return false}});push('현재 배포 주소(HTTPS)와 QR 링크',goodUrl,location.origin);push('Firebase 연결',F.enabled&&F.ready&&F.seeded&&!F.error,F.enabled?'실제 서버 연결 여부':'체험 모드에서는 점검 실패');return check}
function renderPrintAudit(){const results=state.printAudit||auditPrintQuick();return `<div class="v29-audit-items">${results.map(r=>`<div class="${r.ok?'pass':'fail'}"><b>${r.ok?'✓':'!'} ${escapeHTML(r.label)}</b><span>${escapeHTML(r.note||'')}</span></div>`).join('')}</div><p class="tiny">이미지 로딩은 ‘점검 실행’을 눌러 확인할 수 있어요. 브라우저 파일 열기 상태에서는 HTTPS 주소 점검이 실패합니다.</p>`}
async function auditAllImages(){if(state.printAuditBusy)return;state.printAuditBusy=true;state.printAudit=null;render();const checks=auditPrintQuick();const files=[...data.treasures,...data.memes].filter(item=>imageSrc(item.image));const result=await Promise.all(files.map(item=>new Promise(resolve=>{const img=new Image();let done=false;const finish=(ok)=>{if(done)return;done=true;clearTimeout(timer);img.onload=img.onerror=null;resolve(ok)};const timer=setTimeout(()=>finish(false),5500);img.onload=()=>finish(true);img.onerror=()=>finish(false);img.src=imageSrc(item.image)})));let goodQr=0;for(const q of data.qrs){try{const canvas=qrCanvas(qrUrl(q),64);if(canvas.width===64&&canvas.height===64)goodQr++;}catch(e){console.warn('QR 생성 실패',q.id,e)}}checks.push({label:`실제 QR 이미지 ${data.qrs.length}개 생성`,ok:goodQr===data.qrs.length,note:`정상 ${goodQr}/${data.qrs.length}개`});checks.push({label:'등록된 이미지 로딩',ok:result.every(Boolean),note:`정상 ${result.filter(Boolean).length}/${files.length}개`});state.printAudit=checks;state.printAuditBusy=false;render();toast(checks.every(c=>c.ok)?'✅ 인쇄 점검 완료!':'⚠️ 일부 점검 항목을 확인해 주세요.')}
function renderQRAdmin(){let term=state.adminSearch.trim().toLowerCase(),qs=data.qrs.filter(q=>!term||[q.id,q.code,q.location,q.kind,q.treasureId].some(x=>String(x).toLowerCase().includes(term)));return `<div class="panel"><div class="row space"><div><h2 class="h2">🗺 QR코드 ${data.qrs.length}개 관리</h2><p class="muted">QR 인쇄물은 그대로! 보물·꽝만 실시간으로 바꿀 수 있어요.</p></div><div class="row"><button class="btn sun small" id="addQrs">+ QR 추가</button><button class="btn main small" id="randomAssign">🎲 보물 12종 랜덤 배치</button></div></div>${qrWarnings()}${missingDefaultQrs().length?`<div class="v29-bulk-callout"><div><strong>🆕 새 QR ${missingDefaultQrs().length}개 준비됨 (${missingDefaultQrs()[0].id} ~ ${missingDefaultQrs().slice(-1)[0].id})</strong><p>업데이트로 추가된 QR이에요. 등록하면 학생들이 바로 인식할 수 있고, 새로 추가된 QR만 골라 인쇄할 수 있어요. 새 QR은 모두 꽝으로 등록돼요.</p></div><button type="button" class="btn main" id="addDefaultQrs">+ ${missingDefaultQrs().length}개 등록</button></div>`:''}<div class="toolbar"><input class="text" id="qrSearch" placeholder="QR번호, 코드, 설치 위치 검색" style="flex:1;min-width:150px" value="${escapeHTML(state.adminSearch)}"><span class="chip gray">${qs.length} / ${data.qrs.length}</span><button class="btn white small" id="qrExportCsv">⬇ 배치표 CSV</button></div><div class="qr-board-tools"><button class="btn small ${state.qrLayout==='board'?'main':'white'}" id="viewBoard">▦ 카드 보기</button><button class="btn small ${state.qrLayout==='table'?'main':'white'}" id="viewTable">☷ 표 보기</button><button class="btn small ${state.swapMode?'sun':'white'}" id="swapModeToggle">⇄ ${state.swapMode?'교환 모드 ON':'QR 위치 교환'}</button><span class="qr-legend">${state.swapMode?(state.swapSelected?`${state.swapSelected} 선택됨 · 교환할 두 번째 QR을 누르세요.`:'교환할 QR 2개를 차례로 선택하세요.'): '💎 금색: 보물 · 회색: 꽝 / QR을 누르면 편집'}</span></div>
${state.qrLayout==='board'?`<div class="qr-board">${qs.map(q=>`<button class="qr-tile ${q.kind==='treasure'?'treasure':'miss'} ${state.swapSelected===q.id?'selected':''}" data-qr-tile="${q.id}" type="button" title="${escapeHTML(q.location||'설치 위치 미등록')}"><span>${q.kind==='treasure'?'💎':'·'}</span><strong>${q.id.replace('Q','')}</strong><small>${escapeHTML(q.code)}</small></button>`).join('')}</div>`:`<div class="list-wrap" style="margin-top:16px"><table class="data-table"><thead><tr><th>QR</th><th>코드</th><th>종류</th><th>콘텐츠</th><th>설치 위치</th><th>관리</th></tr></thead><tbody>${qs.map(q=>{let kind=q.kind==='treasure',t=data.treasures.find(t=>t.id===q.treasureId),m=data.memes.find(m=>m.id===q.memeId);return `<tr><td><b>${q.id}</b></td><td style="font-family:monospace;font-weight:800">${escapeHTML(q.code)}</td><td><span class="chip ${kind?'gold':'gray'}">${kind?'💎 보물':'🤡 꽝'}</span></td><td>${escapeHTML(kind?(t?.name||'⚠ 미지정'):(q.memeId==='random'?'랜덤 짤':m?.text?.slice(0,18)||'미지정'))}</td><td>${escapeHTML(q.location||'-')}</td><td><button class="btn small light" data-qr-edit="${q.id}">✏️ 수정</button><button class="btn small white" data-qr-test="${q.id}">👀</button><button class="btn small white" data-qr-del="${q.id}" title="${q.id} 삭제">🗑</button></td></tr>`}).join('')}</tbody></table></div>`}<p class="helper" style="margin-top:14px">교환 기능은 보물·꽝 연결만 서로 바꿉니다. QR 번호, 인쇄 코드, 설치 장소는 변하지 않습니다.</p></div>${renderQrLog()}`}
function renderTreasureAdmin(){return `<div class="row space"><div><h2 class="h2">💎 보물 카드 12종 편집</h2><p class="muted">학생회 임원 이름, 이모지, 설명, 사진을 자유롭게 설정할 수 있어요.</p></div></div><div class="v29-bulk-callout"><div><strong>🖼️ 보물 이미지 12종 일괄 등록</strong><p>T01.png ~ T12.png 파일을 자동으로 알맞은 보물 카드에 연결해요. 미리보기 후 등록할 수 있어요.</p></div><button type="button" class="btn main" id="bulkTreasure">📤 이미지 일괄 등록</button></div><div class="admin-edit-grid">${data.treasures.map(t=>`<div class="edit-card"><div class="head"><div class="avatar" style="background:${cleanColor(t.color)}">${t.image?`<img src="${escapeHTML(imageSrc(t.thumb||t.image))}" loading="lazy" decoding="async" data-asset-emoji="${escapeHTML(t.emoji||'🎁')}" alt="">`:escapeHTML(t.emoji)}</div><div style="min-width:0"><div class="tiny">TREASURE ${t.id}</div><div style="font-weight:950;overflow-wrap:anywhere">${escapeHTML(t.name)}</div></div></div><p class="muted" style="font-size:12px;min-height:38px">${escapeHTML(t.description)}</p><div class="stack"><button class="btn light block small" data-treasure-edit="${t.id}">✏️ 카드 수정</button><button class="btn white block small" data-treasure-preview="${t.id}">▶ 발견 연출 미리보기</button></div></div>`).join('')}</div>`}
function renderMemeAdmin(){return `<div class="row space"><div><h2 class="h2">🤡 꽝 이미지·멘트 편집</h2><p class="muted">이미지, 멘트, 연출 유형을 각각 수정할 수 있어요.</p></div><button class="btn main small" id="addMeme">+ 꽝 추가</button></div>

ass="btn light block" id="exportJSON">⬇ 게임 설정 JSON 백업</button><label class="btn white block">⬆ 백업 JSON 가져오기<input type="file" id="importJSON" accept=".json,application/json" style="display:none"></label><button class="btn danger block" id="resetRecords">🚨 전체 탐험 기록 초기화 (학생 정보 유지)</button></div><p class="tiny">행사 중 QR 배치를 바꾸면 이미 수집한 도감은 자동으로 취소되지 않습니다.</p></div></div></div>`}

async function addQrs(count,location=''){if(state.qrBusy)return;count=Math.max(1,Math.min(50,Number(count)||0));if(F.enabled&&!isAdmin()){toast('관리자 로그인이 필요해요.');return}state.qrBusy=true;
 try{const used=new Set(data.qrs.map(q=>q.code)),ids=new Set(data.qrs.map(q=>q.id));let no=qrNextNo();const list=[];
  while(list.length<count){const id=`Q${pad(no)}`;no++;if(ids.has(id))continue;const def=defaultQrs.find(d=>d.id===id);const code=def&&!used.has(def.code)?def.code:newQrCode(used);used.add(code);list.push({id,code,kind:'miss',treasureId:'',memeId:'random',location:String(location||'').slice(0,60)})}
  if(F.enabled){await batchSaveEntities('qrs',list);await updateEntity('settings','app',{qrNextNo:no})}
  data.qrs=sortQrs([...data.qrs,...list]);data.settings={...data.settings,qrNextNo:no};saveLocal();
  const range=`${list[0].id} ~ ${list[list.length-1].id}`;await recordQrChange(`QR ${list.length}개 추가 (${range})`);
  showDialog(`<div class="result-icon">✅</div><h2 class="result-title">QR ${list.length}개를 추가했어요</h2><p class="result-description">${range} · 모두 꽝으로 등록됐어요.<br>이제 학생들이 바로 인식할 수 있어요.</p><button class="btn main block" id="printNewQrs">🖨 새로 추가한 QR만 인쇄하기</button><button class="btn white block" data-close style="margin-top:8px">닫기</button>`);
  $('#printNewQrs').onclick=()=>{state.printFrom=qrNum(list[0].id);state.printTo=qrNum(list[list.length-1].id);state.qrPage=1;state.adminTab='print';hideDialog();render();window.scrollTo(0,0)};
  render()}
 catch(err){toast('QR 추가 실패: '+err.message)}finally{state.qrBusy=false}}
async function deleteQr(id){const q=data.qrs.find(x=>x.id===id);if(!q||state.qrBusy)return;
 if(q.kind==='treasure'){toast('보물 QR은 삭제할 수 없어요. 먼저 꽝으로 바꾸거나 다른 QR과 교환한 뒤 삭제하세요.');return}
 if(data.qrs.length<=12){toast('QR은 최소 12개가 필요해요.');return}
 if(!importantQrChange(`${id} 삭제`))return;
 if(!confirm(`${id} (코드 ${q.code})를 삭제할까요?\n\n삭제한 QR을 찍으면 ‘등록되지 않은 QR’로 나와요.\n붙여 둔 인쇄물이 있다면 떼어 주세요.`))return;
 state.qrBusy=true;try{const next=qrNextNo();
  if(F.enabled){if(!isAdmin())throw Error('관리자 로그인이 필요해요.');await F.lib.fs.deleteDoc(F.lib.fs.doc(F.adminDb,'qrs',id));await updateEntity('settings','app',{qrNextNo:next})}
  data.qrs=data.qrs.filter(x=>x.id!==id);data.settings={...data.settings,qrNextNo:next};saveLocal();await recordQrChange(`${id} (${q.code}) 삭제`);

 catch(err){toast('QR 삭제 실패: '+err.message)}finally{state.qrBusy=false}}

async function compressImage(file,onStatus=()=>{}){

async function prepareAsset(file,collection,id,onStatus=()=>{}){

 if(!F.enabled)return await blobToDataUrl(blob);
 if(!F.adminUser||!F.adminStorage)throw Error('관리자 Storage 연결이 필요해요. 다시 로그인한 후 시도해 주세요.');
 const storage=F.lib.storage;
 const target=storage.ref(F.adminStorage,`game-assets/${collection}/${id}/${Date.now()}-${Math.floor(Math.random()*100000)}.jpg`);
 onStatus('Firebase Storage에 업로드 중… 0%');
 const task=storage.uploadBytesResumable(target,blob,{contentType:'image/jpeg',cacheControl:'public,max-age=3600'});
 await new Promise((resolve,reject)=>{
   let settled=false;
   const finish=(err)=>{if(settled)return;settled=true;clearTimeout(timer);err?reject(err):resolve();};
   const timer=setTimeout(()=>{task.cancel();finish(Error('업로드가 60초 넘도록 완료되지 않았어요. Firebase Storage 버킷 및 규칙을 확인해 주세요.'));},60000);

   },err=>finish(err),()=>finish());
 });
 onStatus('업로드 완료! 이미지 주소를 확인하는 중…');

async function deleteParticipant(id){
 if(state.view!=='admin'||!isAdmin()||state.deletingPlayer)return;
 const p=F.enabled?state.adminPlayers.find(player=>player.id===id):data.participants[id];
 if(!p)return;
 if(!confirm(fullName(p)+' 학생의 참가 정보와 탐험 기록을 삭제할까요? 이 학생의 최초 발견 기록도 삭제됩니다. 삭제 후 복구할 수 없어요.'))return;
 state.deletingPlayer=id;
 render();
 try{
  if(F.enabled){
   const fs=F.lib.fs,ref=fs.doc(F.adminDb,'players',id);
   const treasureIds=new Set([...data.treasures.map(t=>t.id),...Object.keys(data.firstFinds)]);
   const released=await fs.runTransaction(F.adminDb,async trx=>{
    const player=await trx.get(ref);
    const ids=new Set([...treasureIds,...(player.data()?.collectedIds||[])]);
    const firsts=await Promise.all([...ids].map(tid=>trx.get(fs.doc(F.adminDb,'firstFinds',tid))));
    const owned=firsts.filter(snap=>snap.data()?.playerId===id);
    owned.forEach(snap=>trx.delete(snap.ref));
    if(player.exists())trx.delete(ref);
    return owned.map(snap=>snap.id);
   });
   state.adminPlayers=state.adminPlayers.filter(player=>player.id!==id);
   try{await fs.deleteDoc(fs.doc(F.adminDb,'ranks',id))}catch(e){console.warn('랭킹 삭제 실패',e)}
   released.forEach(tid=>{if(data.firstFinds[tid]?.playerId===id)delete data.firstFinds[tid]});
  }else{
   const next=readLocal();
   delete next.participants[id];
   for(const [tid,first] of Object.entries(next.firstFinds)){
    if(first.playerId===id)delete next.firstFinds[tid];
   }
   localStorage.setItem(STORE,JSON.stringify(next));
   data=next;
  }
  clearDeletedParticipant(id);
  toast('선택한 학생의 참가 정보와 탐험 기록을 삭제했어요.');
 }catch(err){
  toast(err.code==='permission-denied'?'삭제 권한이 없어요. Firestore에서 관리자의 학생 기록 삭제 권한을 확인해 주세요.':'학생 기록을 삭제하지 못했어요: '+err.message);
 }finally{
  state.deletingPlayer=null;
  render();
 }
}

try{let version='10.14.1';const [app,auth,fs,storage]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${version}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${version}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${version}/firebase-firestore.js`),import(`https://www.gstatic.com/firebasejs/${version}/firebase-storage.js`)]);F.lib={app,auth,fs,storage};F.app=app.initializeApp(F.config,'treasure_students');F.auth=auth.getAuth(F.app);F.db=fs.getFirestore(F.app);let a=app.initializeApp(F.config,'treasure_administrators');F.adminAuth=auth.getAuth(a);F.adminDb=fs.getFirestore(a);F.adminStorage=storage.getStorage(a);

 try{await reloadCloud()}catch(e){F.error='서버 데이터 읽기 실패: '+e.message;render();return}
 auth.onAuthStateChanged(F.adminAuth,async u=>{if(!u){F.adminUser=null;if(adminUnsubscribe){adminUnsubscribe();adminUnsubscribe=null}if(state.view==='admin')render();return}try{const proof=await fs.getDoc(fs.doc(F.adminDb,'admins',u.uid));F.adminUser=proof.exists()?u:null;if(F.adminUser){watchAdminPlayers();await loadAdminPlayers()}}catch{F.adminUser=null}if(state.view==='admin')render()});
 fs.onSnapshot(fs.collection(F.db,'firstFinds'),qs=>{data.firstFinds={};qs.docs.forEach(d=>data.firstFinds[d.id]=d.data());if(state.participant&&state.view==='home')render()},e=>console.warn('firstFinds realtime',e));
 fs.onSnapshot(fs.collection(F.db,'qrs'),qs=>{if(qs.size){data.qrs=sortQrs(qs.docs.map(d=>({kind:'miss',treasureId:'',memeId:'random',location:'',...d.data(),id:d.id})));F.seeded=true;if(state.view==='admin'&&['qrs','print'].includes(state.adminTab)&&!state.modal)render()}},e=>console.warn('qrs realtime',e));
 fs.onSnapshot(fs.collection(F.db,'treasures'),qs=>{if(qs.size){data.treasures=defaultTreasures.map(t=>({...t,...qs.docs.find(d=>d.id===t.id)?.data()}));if(state.participant&&state.view==='home')render()}},e=>console.warn('treasures realtime',e));
 fs.onSnapshot(fs.collection(F.db,'memes'),qs=>{if(qs.size)data.memes=qs.docs.map(d=>({id:d.id,...d.data()}))},e=>console.warn('memes realtime',e));
 fs.onSnapshot(fs.doc(F.db,'settings','app'),snap=>{if(snap.exists()){data.settings={...defaultSettings,...snap.data(),phase:snap.data().phase||(snap.data().eventOpen===false?'ended':'running')};if(state.view!=='admin')render()}},e=>console.warn('settings realtime',e));
 startRankWatch();
 const profile=getStoredProfile();if(profile&&profile.id===F.uid){let p=await fs.getDoc(fs.doc(F.db,'players',F.uid));if(p.exists()){state.participant={id:F.uid,...p.data()};saveCollectionCache(state.participant);state.view='home'}else if(!p.metadata.fromCache){clearDeletedParticipant(profile.id)}}
 fs.onSnapshot(fs.doc(F.db,'players',F.uid),snap=>{
  if(snap.exists()&&state.participant){state.participant={id:F.uid,...snap.data()};saveCollectionCache(state.participant);syncRank();updateRankUI();if(state.view==='home'&&!state.modal)render()}
  else if(!snap.exists()&&!snap.metadata.fromCache&&state.participant?.id===F.uid){clearDeletedParticipant(F.uid);render()}
 },e=>console.warn('player realtime',e));
 render();handlePending();
 }catch(err){F.error=err.message||String(err);F.ready=false;const saved=getStoredProfile();const cached=saved?.id?restoreCollectionCache(saved.id):null;if(cached){state.participant=cached;try{const old=JSON.parse(localStorage.getItem(collectionCacheKey(saved.id))||'null');if(Array.isArray(old?.treasures)&&old.treasures.length===12)data.treasures=old.treasures}catch{}state.view='home'}render();}}
// QR URL로 직접 진입한 경우, 등록 후 자동 판정합니다.
window.addEventListener('online',()=>{networkOnline=true;if(state.view==='home'&&!state.modal)render();});window.addEventListener('offline',()=>{networkOnline=false;if(state.view==='home'&&!state.modal)render();});
window.addEventListener('storage',e=>{
 if(F.enabled||e.key!==STORE||!state.participant)return;
 const next=readLocal();
 if(next.participants[state.participant.id])return;
 data=next;clearDeletedParticipant(state.participant.id);render();
});
window.addEventListener('popstate',()=>{if(location.search.includes('qr=')){state.pendingCode=new URLSearchParams(location.search).get('qr');handlePending()}});
initFirebase();
})();
